      /* Pre-React boot splash — every tab shows the animated bot mascot from
         first paint on a solid dark backdrop, matching the app's dark theme. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #09090b;
        z-index: 9999;
        transition: opacity 700ms ease-out;
      }
      #boot-splash.boot-splash-hidden { opacity: 0; }
      #boot-splash p {
        color: #a1a1aa;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 0.875rem;
        margin: 0;
        animation: boot-splash-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-splash-pulse {
        0%, 100% { opacity: 0.5; }
        50%      { opacity: 1; }
      }
      /* Bot mascot animations — prefixed to avoid collisions with other SVGs. */
      #boot-splash .lb-antenna-dot { animation: lb-antennaPulse 1s ease-in-out infinite; }
      @keyframes lb-antennaPulse {
        0%,100% { fill: #06B6D4; }
        50%     { fill: #4F46E5; }
      }
      #boot-splash .lb-wave1 { animation: lb-waveSignal 1.4s ease-in-out infinite; opacity: 0; stroke-dasharray: 40; stroke-dashoffset: 40; }
      #boot-splash .lb-wave2 { animation: lb-waveSignal 1.4s ease-in-out 0.25s infinite; opacity: 0; stroke-dasharray: 60; stroke-dashoffset: 60; }
      #boot-splash .lb-wave3 { animation: lb-waveSignal 1.4s ease-in-out 0.5s infinite; opacity: 0; stroke-dasharray: 80; stroke-dashoffset: 80; }
      @keyframes lb-waveSignal {
        0%   { opacity: 0; stroke-dashoffset: 40; }
        30%  { opacity: 0.9; }
        70%  { opacity: 0.6; stroke-dashoffset: 0; }
        100% { opacity: 0; stroke-dashoffset: -20; }
      }
      #boot-splash .lb-bot-body { animation: lb-slideUp 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards; opacity:0; transform:translateY(20px); }
      #boot-splash .lb-head { animation: lb-slideUp 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.15s forwards; opacity:0; transform:translateY(20px); }
      #boot-splash .lb-antenna-group { animation: lb-slideUp 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.45s forwards; opacity:0; }
      @keyframes lb-slideUp { to { opacity:1; transform:translateY(0); } }
      #boot-splash .lb-bar1 { animation: lb-barPulse1 1.8s ease-in-out 1s infinite; }
      #boot-splash .lb-bar2 { animation: lb-barPulse2 1.8s ease-in-out 1s infinite; }
      #boot-splash .lb-bar3 { animation: lb-barPulse3 1.8s ease-in-out 1s infinite; }
      #boot-splash .lb-bar4 { animation: lb-barPulse4 1.8s ease-in-out 1s infinite; }
      #boot-splash .lb-bar5 { animation: lb-barPulse5 1.8s ease-in-out 1s infinite; }
      @keyframes lb-barPulse1 { 0%,100%{height:14px;y:176px} 50%{height:20px;y:170px} }
      @keyframes lb-barPulse2 { 0%,100%{height:22px;y:168px} 50%{height:16px;y:174px} }
      @keyframes lb-barPulse3 { 0%,100%{height:30px;y:160px} 50%{height:36px;y:154px} }
      @keyframes lb-barPulse4 { 0%,100%{height:40px;y:150px} 50%{height:30px;y:160px} }
      @keyframes lb-barPulse5 { 0%,100%{height:50px;y:140px} 50%{height:58px;y:132px} }
      #boot-splash .lb-pulse-eye   { animation: lb-eyePulse 2s ease-in-out infinite; }
      #boot-splash .lb-pulse-eye-r { animation: lb-eyePulse 2s ease-in-out 0.3s infinite; }
      @keyframes lb-eyePulse { 0%,100%{r:3.5} 50%{r:5} }
      #boot-splash .lb-blink-l { animation: lb-blink 4s ease-in-out 2s infinite; }
      #boot-splash .lb-blink-r { animation: lb-blink 4s ease-in-out 2.3s infinite; }
      @keyframes lb-blink { 0%,88%,100%{ry:8} 94%{ry:1} }
      #boot-splash .lb-idle-bob { animation: lb-bob 3s ease-in-out 1.2s infinite; }
      @keyframes lb-bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    </style>
